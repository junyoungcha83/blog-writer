<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>블로그작성</title>
<link rel="stylesheet" href="assets/app.css?v=2" />

<!-- PWA -->
<link rel="manifest" href="manifest.webmanifest?v=2" />
<meta name="theme-color" content="#0f172a" />
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png" />
<link rel="icon" type="image/svg+xml" href="assets/icon.svg" />

<!-- iOS 홈 화면 추가 — apple-touch-icon 은 PNG 만 지원한다(SVG 는 무시되고 스크린샷이 쓰임) -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="블로그작성" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
</head>
<body>

<header class="app-header">
  <h1>블로그작성</h1>
  <button class="hdr-btn" id="settingsBtn" type="button" aria-label="설정">⚙︎</button>
</header>

<nav class="viewtabs" id="viewtabs" role="tablist" aria-label="보기 전환">
  <button class="vtab active" data-view="write" role="tab" aria-selected="true">✍️ 새 글</button>
  <button class="vtab" data-view="result" role="tab" aria-selected="false">📄 결과</button>
  <button class="vtab" data-view="history" role="tab" aria-selected="false">🗂 이력</button>
  <button class="vtab" data-view="info" role="tab" aria-selected="false">ℹ️ 정보</button>
</nav>

<!-- ── 새 글 ─────────────────────────────────── -->
<div class="view" id="view-write">

  <!-- 입력 방식 -->
  <div class="block">
    <div class="block-h">1. 무엇으로 쓸까요?</div>
    <div class="modetabs" id="modetabs" role="tablist" aria-label="입력 방식">
      <button class="mtab active" data-mode="url" role="tab" aria-selected="true">기사 링크</button>
      <button class="mtab" data-mode="text" role="tab" aria-selected="false">원문 붙여넣기</button>
      <button class="mtab" data-mode="topic" role="tab" aria-selected="false">주제만</button>
    </div>

    <div class="inp" id="inp-url">
      <input class="tf" id="inUrl" type="url" inputmode="url" placeholder="https://… 기사 링크" autocomplete="off" />
      <small>링크 본문을 읽고, 같은 사안을 다룬 다른 출처를 함께 찾습니다.</small>
    </div>
    <div class="inp hidden" id="inp-text">
      <textarea class="tf ta" id="inText" rows="7" placeholder="기사 본문이나 자료를 그대로 붙여넣으세요."></textarea>
      <small>붙여넣은 내용을 기준으로 사실을 확인하고 뒷받침 자료를 찾습니다.</small>
    </div>
    <div class="inp hidden" id="inp-topic">
      <input class="tf" id="inTopic" type="text" placeholder="예: 2026년 하반기 서울 아파트 시장 전망" autocomplete="off" />
      <small>주제만 있으면 검색 키워드부터 만들어 자료를 모읍니다.</small>
    </div>
  </div>

  <!-- 옵션 -->
  <div class="block">
    <div class="block-h">2. 어떻게 쓸까요?</div>
    <div id="opts"></div>
  </div>

  <!-- 실행 -->
  <div class="block">
    <button class="go wide" id="runBtn" type="button">글 만들기</button>
    <p class="note" id="runNote"></p>
    <div id="stages"></div>
  </div>
</div>

<!-- ── 결과 ──────────────────────────────────── -->
<div class="view hidden" id="view-result">
  <main class="result" id="resultBody"></main>
</div>

<!-- ── 이력 ──────────────────────────────────── -->
<div class="view hidden" id="view-history">
  <main class="result" id="historyBody"></main>
</div>

<!-- ── 정보 ──────────────────────────────────── -->
<div class="view hidden" id="view-info">
  <main class="result" id="infoBody"></main>
</div>

<!-- ── 설정 시트 ─────────────────────────────── -->
<div class="sheet hidden" id="sheet">
  <div class="sheet-box">
    <div class="sheet-head"><h2>설정</h2><button class="sheet-x" id="sheetClose" type="button">✕</button></div>

    <label class="fld">
      <span>Anthropic API 키</span>
      <input class="tf" id="apiKey" type="password" placeholder="sk-ant-…" autocomplete="off" />
      <small>이 기기에만 저장돼요(localStorage). 브라우저에서 Anthropic 서버로 바로 보냅니다.
        공용 기기에서는 쓰지 말고, 필요 없어지면 콘솔에서 키를 폐기하세요.</small>
    </label>

    <label class="fld">
      <span>모델</span>
      <select class="tf" id="model">
        <option value="claude-sonnet-5">Claude Sonnet 5 — 속도·품질·가격 균형 (기본)</option>
        <option value="claude-opus-5">Claude Opus 5 — 가장 똑똑함 · 가장 비쌈</option>
        <option value="claude-haiku-4-5">Claude Haiku 4.5 — 가장 저렴 (자료수집·분석 품질 낮음)</option>
      </select>
      <small>글 1편에 웹검색 비용과 토큰 비용이 듭니다. 평소엔 <b>Sonnet 5</b>가 무난해요.</small>
    </label>

    <label class="fld chk">
      <input type="checkbox" id="opusWriter" />
      <span>본문 작성(Writer)만 Opus 5로</span>
      <small>자료수집·팩트체크·SEO는 위에서 고른 모델로, 본문만 상위 모델로 씁니다. 편당 $0.06 내외 추가.</small>
    </label>

    <label class="fld">
      <span>이번 달 비용 한도 (USD)</span>
      <input class="tf" id="budget" type="number" min="0" step="1" placeholder="10" />
      <small>누적이 한도를 넘으면 실행 전에 물어봅니다. 비워 두면 확인하지 않습니다.</small>
    </label>

    <label class="fld chk">
      <input type="checkbox" id="aiNotice" />
      <span>본문 끝에 AI 작성 고지 넣기</span>
      <small>“이 글은 AI 도움을 받아 작성했으며 사람이 검토했습니다” 한 줄을 붙입니다.</small>
    </label>

    <div class="sheet-btns">
      <button class="go" id="saveSet" type="button">저장</button>
      <button class="ghost" id="clearAll" type="button">이력·초안 지우기</button>
    </div>
    <p class="sheet-note">키 발급: <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener noreferrer">console.anthropic.com ↗</a></p>
  </div>
</div>

<script src="assets/agents.js?v=2"></script>
<script src="assets/app.js?v=2"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
</body>
</html>
